apiVersion: v1
kind: Secret
metadata:
  name: issue-tracker-secret
  namespace: issue-tracker
type: Opaque
stringData:
  # Local demo values only. For a real deployment, create k8s/secret.yaml
  # with different values and do not commit it.
  MYSQL_ROOT_PASSWORD: root
  MYSQL_PASSWORD: password
  DB_PASSWORD: password
  JWT_SECRET: change-this-to-a-long-secret-key-at-least-32-bytes
