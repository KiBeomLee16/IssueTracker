apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-tracker-api
  namespace: issue-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: issue-tracker-api
  template:
    metadata:
      labels:
        app: issue-tracker-api
    spec:
      initContainers:
        - name: wait-for-mysql-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "waiting for mysql:3306"
                sleep 2
              done
              until nc -z redis 6379; do
                echo "waiting for redis:6379"
                sleep 2
              done
      containers:
        - name: issue-tracker-api
          image: issue-tracker-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: issue-tracker-config
            - secretRef:
                name: issue-tracker-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: issue-tracker-api
  namespace: issue-tracker
spec:
  selector:
    app: issue-tracker-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
